<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>페이지를 찾을 수 없습니다 | 전소현</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="/assets/css/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👩‍💻</text></svg>" />
<style>
  .notfound {
    min-height: 100vh;
    display: grid;
    place-content: center;
    justify-items: center;
    text-align: center;
    gap: 14px;
    padding: 32px;
  }
  .notfound__code {
    font-size: clamp(4rem, 16vw, 7rem);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.03em;
  }
  .notfound__msg { font-size: 1.05rem; font-weight: 600; }
  .notfound__sub { color: var(--text-mute); font-size: 0.92rem; }
  .notfound__home {
    margin-top: 14px;
    padding: 10px 22px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--surface);
    transition: border-color 0.18s ease, transform 0.18s ease, color 0.18s ease;
  }
  .notfound__home:hover {
    border-color: var(--accent-line);
    color: var(--accent);
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <main class="notfound">
    <p class="notfound__code">404</p>
    <p class="notfound__msg">페이지를 찾을 수 없습니다</p>
    <p class="notfound__sub">요청하신 주소가 변경되었거나 존재하지 않습니다.</p>
    <a class="notfound__home" href="/">이력서로 돌아가기</a>
  </main>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('resume-theme'); } catch (e) {}
    document.documentElement.setAttribute(
      'data-theme',
      t || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    );
  })();
</script>
</body>
</html>
